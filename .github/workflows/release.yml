name: Publish Android release

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lattice-v1.0.1-release
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish v1.0.1
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Build and test
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug

      - name: Prepare release asset
        run: cp app/build/outputs/apk/debug/app-debug.apk lattice-v1.0.1.apk

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.0.1 >/dev/null 2>&1; then
            gh release upload v1.0.1 lattice-v1.0.1.apk --clobber
          else
            gh release create v1.0.1 lattice-v1.0.1.apk \
              --title "Lattice v1.0.1" \
              --notes "Reader update: selectable note text, one-tap copy for the full note, clearer internal and external links, improved Obsidian wiki-link resolution, callouts, tables, highlights, tags, and embeds."
          fi
